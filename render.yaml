services:
  - type: web
    name: student-practice-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "sqlite:////tmp/database.db"
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: student-practice-frontend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    # Для раздачи собранных файлов используем serve через npx
    startCommand: cd frontend && npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_API_URL
        value: ""  # сюда вставьте URL бэкенда после его успешного деплоя (например https://your-backend.onrender.com)
