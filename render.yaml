services:
  - type: web
    name: student-practice-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        value: "sqlite:////tmp/database.db"
      - key: SECRET_KEY
        generateValue: true

  - type: static_site
    name: student-practice-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: ""  # поставьте сюда URL бэкенда после деплоя или задайте в панели Render
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
